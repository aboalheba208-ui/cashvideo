<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاش فيديو - Cash Video App</title>
    <!-- سكربت منصة Adsgram للإعلانات -->
    <script src="https://sad.adsgram.ai/js/adsgram.min.js?v=1"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .points-box {
            font-size: 20px;
            background: #eab308;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .ad-button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        .ad-button:hover {
            background-color: #1d4ed8;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cash Video</h2>
        <div class="points-box">💰 رصيدك: <span id="userPoints">0</span> نقطة</div>
        
        <button class="ad-button" onclick="showAd()">مقطع المكافآت السريع 🎁<br><small>شاهد الإعلان واربح نقاط</small></button>
        
        <div class="status" id="statusMessage">اضغط على الزر أعلاه لبدء مشاهدة الإعلان</div>
    </div>

    <script>
        // تهيئة إعلانات Adsgram بالمعرف الخاص بك
        const adController = window.Adsgram.init({ blockId: "39483" });
        
        let currentPoints = 0;

        function showAd() {
            const statusEl = document.getElementById("statusMessage");
            statusEl.innerText = "جاري تحميل الإعلان...";

            adController.show().then((result) => {
                // نجاح مشاهدة الإعلان بالكامل
                currentPoints += 150;
                document.getElementById("userPoints").innerText = currentPoints;
                statusEl.innerText = "🎉 مبروك! تمت إضافة 150 نقطة لرصيدك.";
            }).catch((result) => {
                // فشل أو أغلق المستخدم الإعلان قبل نهايته
                console.log("Ad error or closed", result);
                statusEl.innerText = "⚠️ يجب مشاهدة الإعلان كاملاً لتتمكن من جمع المكافأة.";
            });
        }
    </script>

</body>
</html>
