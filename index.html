<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاش فيديو - Cash Video App</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        header h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .points-box {
            background-color: #f59e0b;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تطبيق كاش فيديو</h1>
        <p>شاهد الفيديوهات واجمع الأرباح والنقاط بسهولة</p>
        
        <div class="points-box">
            💰 150 نقطة
        </div>

        <button class="btn" onclick="watchVideo()">مشاهدة فيديو وكسب نقاط</button>
    </div>

    <script>
        function watchVideo() {
            alert("تم تسجيل النقاط بنجاح! سيتم تحويلك للمحتوى.");
        }
    </script>

</body>
</html>
